# Deployment owner only. Do not label this as a managed runtime component.
name: synthetic-qa-zns-registration-fixture-owner
services:
  coordinator:
    image: ${ZNS_COORDINATOR_IMAGE:?Supply the reviewed local coordinator image}
    user: "0:0"
    entrypoint: [/usr/local/bin/znsreplace]
    command: [/config/replacement.json]
    pull_policy: never
    restart: on-failure
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    env_file:
      - path: ${ZNS_REGISTRATION_SECRET_DIR:?Protected host environment directory}/inventory.env
        format: raw
    environment:
      ZNS_REGISTRATION_SECRET_DIR: /config/private
      ZNS_APP_UID: ${ZNS_APP_UID:?Actual inspected app UID}
      ZNS_APP_GID: ${ZNS_APP_GID:?Actual inspected app GID}
      FQA_REGISTRATION_SETUP_ANCHOR: ${FQA_REGISTRATION_SETUP_ANCHOR:?Reviewed immutable setup anchor}
      ZNS_APP_IMAGE: ${ZNS_APP_IMAGE:?}
      ZNS_SCRIPT_IMAGE: ${ZNS_SCRIPT_IMAGE:?}
      ZNS_MEDIA_DECODER_IMAGE: ${ZNS_MEDIA_DECODER_IMAGE:?}
      ZNS_MEDIA_BROKER_IMAGE: ${ZNS_MEDIA_BROKER_IMAGE:?}
      ZNS_STICKER_DECODER_IMAGE: ${ZNS_STICKER_DECODER_IMAGE:?}
      ZNS_STICKER_BROKER_IMAGE: ${ZNS_STICKER_BROKER_IMAGE:?}
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind: { create_host_path: false }
      - type: bind
        source: /etc/machine-id
        target: /etc/machine-id
        read_only: true
        bind: { create_host_path: false }
      - state:/state
      - config:/config:ro
    networks: [sandbox]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
networks:
  sandbox:
    external: true
    name: synthetic-qa-zns-registration-fixture
volumes:
  state:
    external: true
    name: synthetic-qa-zns-registration-fixture-state

  config:
    external: true
    name: synthetic-qa-zns-registration-fixture-config
