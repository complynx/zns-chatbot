# Reviewable preparation only: requires frozen reviewed images and private files.
name: synthetic-qa-zns-registration-fixture-prerequisites
x-tool: &tool
  image: ${ZNS_APP_IMAGE:?Reviewed current application repository@sha256 required}
  user: "${ZNS_APP_UID:?Actual inspected app UID}:${ZNS_APP_GID:?Actual inspected app GID}"
  pull_policy: never
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [sandbox]
  volumes: ["config:/etc/zns:ro"]
  env_file:
    - path: ${ZNS_REGISTRATION_SECRET_DIR:?Protected private environment directory}/tool.env
      format: raw
x-environment: &environment
  ZNS_CONFIG_FILE: /etc/zns/runtime.yaml
  ZNS_ENV: sandbox
  ZNS_SYNTHETIC_ONLY: "true"
x-clock-environment: &clock-environment
  <<: *environment
  REGISTRATION_CLOCK_FILE: /run/registration-clock/state.json
  REGISTRATION_CLOCK_INSTALLATION: "010400000204"
  REGISTRATION_CLOCK_CASE: c-registration-clock-20261001-v1
  REGISTRATION_CLOCK_DATABASE_ADDRESS: postgres:5432/synthetic_qa_zns_registration_fixture
  REGISTRATION_CLOCK_ANCHOR: ${FQA_REGISTRATION_SETUP_ANCHOR:?Reviewed immutable UTC microsecond setup anchor}
services:
  postgres:
    image: ${ZNS_POSTGRES_IMAGE:?Reviewed cached PostgreSQL17 repository@sha256 required}
    pull_policy: never
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: synthetic_qa_zns_registration_fixture
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports: ["127.0.0.1:58431:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - bootstrap-secrets:/run/secrets:ro
      - ./bootstrap-roles.sh:/docker-entrypoint-initdb.d/10-registration-roles.sh:ro
      - ./product-roles.sql:/bootstrap/product-roles.sql:ro
      - ./inventory-role.sql:/bootstrap/inventory-role.sql:ro
    networks: [sandbox]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "pg_isready -U zns_app -d synthetic_qa_zns_registration_fixture",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *tool
    command: migrate
    environment: *environment
    depends_on:
      postgres: { condition: service_healthy }
  fixtures:
    <<: *tool
    command: product-fixture
    environment: *environment
    depends_on:
      migrate: { condition: service_completed_successfully }
  registration-init:
    <<: *tool
    command: product-fixture
    environment:
      <<: *environment
      REGISTRATION_FIXTURE_ACTION: init
      REGISTRATION_FIXTURE_STAND: synthetic-qa-zns-registration-fixture
      REGISTRATION_FIXTURE_OPENS_AT: ${REGISTRATION_FIXTURE_OPENS_AT:?Reviewed domain opening instant}
      REGISTRATION_FIXTURE_CLOCK_ANCHOR: ${FQA_REGISTRATION_SETUP_ANCHOR:?Reviewed immutable UTC microsecond setup anchor}
    depends_on:
      fixtures: { condition: service_completed_successfully }
  clock-init:
    <<: *tool
    image: ${ZNS_CLOCK_OPERATOR_IMAGE:?Reviewed image with verified registrationclockctl bytes}
    entrypoint: [/usr/local/bin/registrationclockctl]
    command: [-action, init]
    environment: *clock-environment
    volumes: ["config:/etc/zns:ro", "clock:/run/registration-clock"]
    depends_on:
      registration-init: { condition: service_completed_successfully }
  runtime-roles:
    image: ${ZNS_POSTGRES_IMAGE:?Reviewed cached PostgreSQL17 repository@sha256 required}
    pull_policy: never
    user: "${ZNS_APP_UID:?Actual inspected app UID}:${ZNS_APP_GID:?Actual inspected app GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [psql]
    command:
      [
        --no-psqlrc,
        --single-transaction,
        -v,
        ON_ERROR_STOP=1,
        -v,
        ECHO=none,
        -f,
        /bootstrap/runtime-roles.sql,
      ]
    env_file:
      - path: ${ZNS_REGISTRATION_SECRET_DIR:?}/runtime-roles.env
        format: raw
    networks: [sandbox]
    volumes: ["./runtime-roles.sql:/bootstrap/runtime-roles.sql:ro"]
    depends_on:
      registration-init: { condition: service_completed_successfully }
  clock-read:
    <<: *tool
    image: ${ZNS_CLOCK_OPERATOR_IMAGE:?}
    entrypoint: [/usr/local/bin/registrationclockctl]
    command: [-action, read]
    env_file:
      - path: ${ZNS_REGISTRATION_SECRET_DIR:?}/registration-operator.env
        format: raw
    environment: *clock-environment
    volumes: ["config:/etc/zns:ro", "clock:/run/registration-clock"]
    depends_on:
      clock-init: { condition: service_completed_successfully }
      runtime-roles: { condition: service_completed_successfully }
  clock-operator:
    <<: *tool
    profiles: [operator]
    image: ${ZNS_CLOCK_OPERATOR_IMAGE:?}
    entrypoint: [/usr/local/bin/registrationclockctl]
    command: [-action, read]
    env_file:
      - path: ${ZNS_REGISTRATION_SECRET_DIR:?}/registration-operator.env
        format: raw
    environment: *clock-environment
    volumes: ["config:/etc/zns:ro", "clock:/run/registration-clock"]
  registration-read:
    <<: *tool
    profiles: [operator]
    command: product-fixture
    env_file:
      - path: ${ZNS_REGISTRATION_SECRET_DIR:?}/registration-operator.env
        format: raw
    environment:
      <<: *environment
      REGISTRATION_FIXTURE_ACTION: read
      REGISTRATION_FIXTURE_STAND: synthetic-qa-zns-registration-fixture
  fake:
    <<: *tool
    image: ${ZNS_FAKE_IMAGE:?Reviewed current fake repository@sha256 required}
    env_file:
      - path: ${ZNS_REGISTRATION_SECRET_DIR:?}/fake.env
        format: raw
    command: fake
    restart: "no"
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
    environment:
      <<: *environment
      ZNS_CONFIG_FILE: /etc/zns/fake.runtime.yaml
      R104_JOURNAL: /evidence/${R104_CASE:?Fresh reviewed provider evidence case}.jsonl
    volumes:
      - config:/etc/zns:ro
      - type: bind
        source: ${R104_EVIDENCE_DIR:?Absolute private fresh provider evidence directory}
        target: /evidence
        bind: { create_host_path: false }
    ports: ["127.0.0.1:58433:8080", "127.0.0.1:58434:8090"]
    networks:
      sandbox: {}
      front: { gw_priority: 1 }
    depends_on:
      clock-read: { condition: service_completed_successfully }
      runtime-roles: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, zns, health]
      interval: 2s
      timeout: 3s
      retries: 30
networks:
  sandbox:
    name: synthetic-qa-zns-registration-fixture
    internal: true
  front:
    external: true
    name: synthetic-qa-zns-registration-fixture-front
volumes:
  pgdata:
    name: synthetic-qa-zns-registration-fixture-pgdata
  config:
    external: true
    name: synthetic-qa-zns-registration-fixture-config
  clock:
    external: true
    name: synthetic-qa-zns-registration-fixture-clock
  bootstrap-secrets:
    external: true
    name: synthetic-qa-zns-registration-fixture-bootstrap-secrets
