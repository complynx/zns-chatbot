name: synthetic-qa-zns-codex
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: sandbox-owner-only
      POSTGRES_DB: zns
    volumes:
      - codex-pgdata:/var/lib/postgresql/data
      - ./sandbox/roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    ports: ['127.0.0.1:55433:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d zns']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  codex-pgdata:
