version: '2'
sql:
  - engine: postgresql
    schema: internal/store/migrations
    queries: internal/conversation/queries
    gen:
      go:
        package: dbgen
        out: internal/conversation/dbgen
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
        rename:
          created_at: At
