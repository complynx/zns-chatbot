name: zns-script
services:
  evaluator:
    build:
      context: ./platform
      dockerfile: Dockerfile.script
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - script-ipc:/run/script-ipc
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 1
    pids_limit: 32
    restart: unless-stopped
volumes:
  script-ipc:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=10002,gid=10002,mode=0770,nosuid,nodev,noexec
