rule_files: [alerts.yaml]
evaluation_interval: 30s
tests:
  - name: "descriptor disabled or healthy does not alert"
    interval: 30s
    input_series:
      - series: 'zinusya_descriptor_enabled{job="integrations/zinusya",instance="complynx.net"}'
        values: "0+0x10 1+0x10"
      - series: 'zinusya_descriptor_state{job="integrations/zinusya",instance="complynx.net",state="running"}'
        values: "0+0x10 1+0x10"
      - series: 'zinusya_descriptor_blocked{job="integrations/zinusya",instance="complynx.net"}'
        values: "0+0x21"
    alert_rule_test:
      - eval_time: 3m
        alertname: ZinusyaDescriptorUnavailable
        exp_alerts: []
      - eval_time: 8m
        alertname: ZinusyaDescriptorUnavailable
        exp_alerts: []
      - eval_time: 8m
        alertname: ZinusyaDescriptorReconciliationRequired
        exp_alerts: []

  - name: "descriptor failure and unknown effects remain visible while core stays up"
    interval: 30s
    input_series:
      - series: 'up{job="integrations/zinusya",instance="complynx.net"}'
        values: "1+0x10"
      - series: 'zinusya_descriptor_enabled{job="integrations/zinusya",instance="complynx.net"}'
        values: "1+0x10"
      - series: 'zinusya_descriptor_state{job="integrations/zinusya",instance="complynx.net",state="running"}'
        values: "0+0x10"
      - series: 'zinusya_descriptor_blocked{job="integrations/zinusya",instance="complynx.net"}'
        values: "1+0x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: ZinusyaDescriptorUnavailable
        exp_alerts:
          - exp_labels: {job: "integrations/zinusya", instance: "complynx.net", severity: warning}
            exp_annotations:
              summary: Zinusya visual descriptor is unavailable
              description: Core intake can remain ready. Inspect descriptor logs and journal ownership; do not delete uncertain receipts or replace original runs.
      - eval_time: 3m
        alertname: ZinusyaDescriptorReconciliationRequired
        exp_alerts:
          - exp_labels: {job: "integrations/zinusya", instance: "complynx.net", severity: warning}
            exp_annotations:
              summary: Zinusya visual descriptions require reconciliation
              description: Inspect retained blocked journals and their original effects. Do not replay uploads or paid actions; restart after operator reconciliation.

  - name: "healthy empty snapshots and old intentional user wait"
    interval: 30s
    input_series:
      - series: "up{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+0x40"
      - series: "zinusya_tasks_collection_success{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+0x40"
      - series: "zinusya_tasks_last_success_timestamp_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+30x40"
      - series: "zinusya_tasks_snapshot_age_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "0+0x40"
      - series: "zinusya_outbox_collection_success{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+0x40"
      - series: "zinusya_outbox_last_success_timestamp_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+30x40"
      - series: "zinusya_outbox_snapshot_age_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "0+0x40"
      - series: "zinusya_queue_collection_success{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+0x40"
      - series: "zinusya_queue_last_success_timestamp_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+30x40"
      - series: "zinusya_queue_snapshot_age_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "0+0x40"
      - series: "zinusya_tasks_unresolved{job=\"integrations/zinusya\",instance=\"complynx.net\",state=\"awaiting_user\"}"
        values: "1+0x40"
      - series: "zinusya_tasks_oldest_accepted_age_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\",state=\"awaiting_user\"}"
        values: "86400+30x40"
      - series: "zinusya_outbox_unresolved{job=\"integrations/zinusya\",instance=\"complynx.net\",state=\"delivery_unknown\"}"
        values: "0+0x40"
      - series: "zinusya_queue_due{job=\"integrations/zinusya\",instance=\"complynx.net\",kind=\"shuttle_task\",state=\"scheduled\"}"
        values: "0+0x40"
      - series: "zinusya_queue_oldest_scheduled_age_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\",kind=\"shuttle_task\",state=\"scheduled\"}"
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: ZinusyaScrapeUnavailable
        exp_alerts: []
      - eval_time: 10m
        alertname: ZinusyaTasksSnapshotUnavailable
        exp_alerts: []
      - eval_time: 10m
        alertname: ZinusyaOutboxSnapshotUnavailable
        exp_alerts: []
      - eval_time: 10m
        alertname: ZinusyaQueueSnapshotUnavailable
        exp_alerts: []
      - eval_time: 10m
        alertname: ZinusyaTaskUncertain
        exp_alerts: []
      - eval_time: 10m
        alertname: ZinusyaDeliveryUncertain
        exp_alerts: []
      - eval_time: 10m
        alertname: ZinusyaQueueOverdue
        exp_alerts: []
  - name: "target missing even if unrelated target is healthy"
    interval: 30s
    input_series:
      - series: "up{job=\"integrations/zinusya\",instance=\"other.example\"}"
        values: "1+0x40"
    alert_rule_test:
      - eval_time: 1m30s
        alertname: ZinusyaScrapeUnavailable
        exp_alerts: []
      - eval_time: 2m
        alertname: ZinusyaScrapeUnavailable
        exp_alerts:
          - exp_labels: {"job": "integrations/zinusya", "instance": "complynx.net", "severity": "critical"}
            exp_annotations: {"summary": "Zinusya metrics target is unavailable", "description": "Check the bot, Alloy target and private network. Missing telemetry does not prove that the bot stopped."}
      - eval_time: 3m
        alertname: ZinusyaTasksSnapshotUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: ZinusyaOutboxSnapshotUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: ZinusyaQueueSnapshotUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: ZinusyaTaskUncertain
        exp_alerts: []
      - eval_time: 3m
        alertname: ZinusyaDeliveryUncertain
        exp_alerts: []
      - eval_time: 3m
        alertname: ZinusyaQueueOverdue
        exp_alerts: []
  - name: "scrape failure suppresses stale business alerts and resolves"
    interval: 30s
    input_series:
      - series: "up{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "0 0 0 0 0 0 1+0x34"
      - series: "zinusya_tasks_collection_success{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+0x40"
      - series: "zinusya_tasks_last_success_timestamp_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+30x40"
      - series: "zinusya_tasks_snapshot_age_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "0+0x40"
      - series: "zinusya_outbox_collection_success{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+0x40"
      - series: "zinusya_outbox_last_success_timestamp_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+30x40"
      - series: "zinusya_outbox_snapshot_age_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "0+0x40"
      - series: "zinusya_queue_collection_success{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+0x40"
      - series: "zinusya_queue_last_success_timestamp_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+30x40"
      - series: "zinusya_queue_snapshot_age_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "0+0x40"
      - series: "zinusya_tasks_unresolved{job=\"integrations/zinusya\",instance=\"complynx.net\",state=\"auth_unknown\"}"
        values: "1 1 1 1 1 1 0+0x34"
      - series: "zinusya_outbox_unresolved{job=\"integrations/zinusya\",instance=\"complynx.net\",state=\"delivery_unknown\"}"
        values: "1 1 1 1 1 1 0+0x34"
    alert_rule_test:
      - eval_time: 1m30s
        alertname: ZinusyaScrapeUnavailable
        exp_alerts: []
      - eval_time: 2m
        alertname: ZinusyaScrapeUnavailable
        exp_alerts:
          - exp_labels: {"job": "integrations/zinusya", "instance": "complynx.net", "severity": "critical"}
            exp_annotations: {"summary": "Zinusya metrics target is unavailable", "description": "Check the bot, Alloy target and private network. Missing telemetry does not prove that the bot stopped."}
      - eval_time: 2m
        alertname: ZinusyaTasksSnapshotUnavailable
        exp_alerts: []
      - eval_time: 2m
        alertname: ZinusyaOutboxSnapshotUnavailable
        exp_alerts: []
      - eval_time: 2m
        alertname: ZinusyaQueueSnapshotUnavailable
        exp_alerts: []
      - eval_time: 2m
        alertname: ZinusyaTaskUncertain
        exp_alerts: []
      - eval_time: 2m
        alertname: ZinusyaDeliveryUncertain
        exp_alerts: []
      - eval_time: 2m
        alertname: ZinusyaQueueOverdue
        exp_alerts: []
      - eval_time: 4m
        alertname: ZinusyaScrapeUnavailable
        exp_alerts: []
      - eval_time: 4m
        alertname: ZinusyaTasksSnapshotUnavailable
        exp_alerts: []
      - eval_time: 4m
        alertname: ZinusyaOutboxSnapshotUnavailable
        exp_alerts: []
      - eval_time: 4m
        alertname: ZinusyaQueueSnapshotUnavailable
        exp_alerts: []
      - eval_time: 4m
        alertname: ZinusyaTaskUncertain
        exp_alerts: []
      - eval_time: 4m
        alertname: ZinusyaDeliveryUncertain
        exp_alerts: []
      - eval_time: 4m
        alertname: ZinusyaQueueOverdue
        exp_alerts: []
  - name: "missing task family while another target has healthy data"
    interval: 30s
    input_series:
      - series: "up{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+0x40"
      - series: "zinusya_outbox_collection_success{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+0x40"
      - series: "zinusya_outbox_last_success_timestamp_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+30x40"
      - series: "zinusya_outbox_snapshot_age_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "0+0x40"
      - series: "zinusya_queue_collection_success{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+0x40"
      - series: "zinusya_queue_last_success_timestamp_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+30x40"
      - series: "zinusya_queue_snapshot_age_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "0+0x40"
      - series: "zinusya_tasks_collection_success{job=\"integrations/zinusya\",instance=\"other.example\"}"
        values: "1+0x40"
      - series: "zinusya_tasks_last_success_timestamp_seconds{job=\"integrations/zinusya\",instance=\"other.example\"}"
        values: "1+30x40"
      - series: "zinusya_tasks_snapshot_age_seconds{job=\"integrations/zinusya\",instance=\"other.example\"}"
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 1m30s
        alertname: ZinusyaTasksSnapshotUnavailable
        exp_alerts: []
      - eval_time: 2m
        alertname: ZinusyaTasksSnapshotUnavailable
        exp_alerts:
          - exp_labels: {"job": "integrations/zinusya", "instance": "complynx.net", "severity": "warning"}
            exp_annotations: {"summary": "Zinusya task snapshot is unavailable or stale", "description": "Check private metrics and PostgreSQL acquisition/query health. Missing task counts are not zero backlog."}
  - name: "never successful outbox snapshot and subsequent recovery"
    interval: 30s
    input_series:
      - series: "up{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+0x40"
      - series: "zinusya_tasks_collection_success{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
