      - series: "zinusya_queue_collection_success{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+0x40"
      - series: "zinusya_queue_last_success_timestamp_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "1+30x40"
      - series: "zinusya_queue_snapshot_age_seconds{job=\"integrations/zinusya\",instance=\"complynx.net\"}"
        values: "0+0x40"
